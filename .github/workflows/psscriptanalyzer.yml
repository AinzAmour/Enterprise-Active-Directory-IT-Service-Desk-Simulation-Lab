name: PowerShell Script Quality & Linting

on:
  push:
    branches: [ master, main ]
    paths:
      - 'scripts/**'
      - '.github/workflows/psscriptanalyzer.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'scripts/**'

jobs:
  psscriptanalyzer:
    name: PSScriptAnalyzer Linting
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Severity Error, Warning
          if ($results) {
            $results | Format-Table -AutoSize
            $errors = $results | Where-Object { $_.Severity -eq 'Error' }
            if ($errors) {
              Write-Error "PSScriptAnalyzer detected $($errors.Count) critical errors."
              exit 1
            }
          } else {
            Write-Host "All PowerShell scripts passed PSScriptAnalyzer validation with zero warnings/errors!" -ForegroundColor Green
          }
